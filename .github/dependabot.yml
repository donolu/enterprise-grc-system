version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    reviewers:
      - "donolu"
    assignees:
      - "donolu"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels: ["dependencies", "python"]
    groups:
      python-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      python-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "djangorestframework"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 2
    reviewers:
      - "donolu"
    assignees:
      - "donolu"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels: ["dependencies", "frontend", "nodejs"]
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 1
    reviewers:
      - "donolu"
    assignees:
      - "donolu"
    commit-message:
      prefix: "docker"
    labels: ["dependencies", "docker"]
    groups:
      docker-non-major:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "10:00"
    open-pull-requests-limit: 1
    reviewers:
      - "donolu"
    assignees:
      - "donolu"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions", "ci/cd"]
    groups:
      github-actions-non-major:
        update-types: ["minor", "patch"]
